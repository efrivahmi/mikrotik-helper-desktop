name: Desktop build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  desktop:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - if: runner.os == 'Windows'
        run: npx electron-builder --win nsis portable --x64 --publish never
      - if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: MikroTik-Helper-${{ runner.os }}
          path: |
            release/*.exe
            release/*.AppImage
